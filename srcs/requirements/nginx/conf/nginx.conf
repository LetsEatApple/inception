events {}

http {

	server {

		# SSL configuration

		# server listening for incoming connections on port 443 for both IPv4 and IPv6
		listen 443 ssl;
		listen [::]:443 ssl;

		# login / domain name?
		server_name www.lhagemos.42.de lhagemos.42.de;

		# specifing the locations of the SSL/TLS certificate and private key
		ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
		ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

		# specifing version of TLS
		ssl_protocols TLSv1.3;

		# Add index.php to the list if you are using PHP
		#index index.php index.html index.htm index.nginx-debian.html;
		
		# specifing the default file that should be served and the root directory for searching files
		index index.php;
		root /var/www/html;


		# pass PHP scripts to FastCGI server
		location ~ \.php$ {
			#try_files $uri =404;

			# passing the request to a FastCGI server for processing
			fastcgi_pass wordpress:9000;

			# includes a file with FastCGI parameters
			include fastcgi_params;

			# sets a FastCGI parameter. SCRIPT_FILENAME specifies path to the php script that should be executed
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

	}

}